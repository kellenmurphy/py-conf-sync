version: 2
registries:
  dhi-io:
    type: docker-registry
    url: https://dhi.io
    username: ${{ secrets.DHI_IO_USERNAME }}
    password: ${{ secrets.DHI_IO_TOKEN }}

updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    groups:
      github-actions:
        patterns: ["*"]

  - package-ecosystem: "docker"
    directory: "/"
    registries:
      - dhi-io
    schedule:
      interval: "weekly"
      day: "monday"

  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    groups:
      python-deps:
        patterns: ["*"]
